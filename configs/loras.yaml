# Catalog of Diffusers PEFT LoRAs (*.safetensors).
# Do NOT mix ComfyUI-named files here — those use a different key layout.
# Official LightX2V files: https://huggingface.co/lightx2v/Minimax-h3-Turbo

catalog:
  - id: none
    name: Base MiniMax-H3 (no LoRA, ~50 NFE)
    repo: null
    filename: null
    nfe: 50
    video_shift: 12.0
    audio_shift: 3.0
    lora_alpha: 8
    lora_scale: 1.0
    megapixels: 1.0
    notes: Highest quality, slowest. Use only if you can wait several minutes per clip.

  - id: fl2va_turbo_8step_768p
    name: FL2VA Turbo 8-step v1.0 768p (recommended)
    repo: lightx2v/Minimax-h3-Turbo
    filename: minimax_h3_fl2v_turbo_8step_v1.0_768p_bf16.safetensors
    nfe: 8
    video_shift: 6.0
    audio_shift: 3.0
    lora_alpha: 128
    lora_scale: 1.0
    megapixels: 1.0
    recommended: true
    notes: LightX2V Studio default. 1344x768, 8 transformer evaluations.

  - id: fl2va_turbo_4step_768p
    name: FL2VA Turbo 4-step v1.0 768p
    repo: lightx2v/Minimax-h3-Turbo
    filename: minimax_h3_fl2v_turbo_4step_v1.0_768p_bf16.safetensors
    nfe: 4
    video_shift: 6.0
    audio_shift: 3.0
    lora_alpha: 128
    lora_scale: 1.0
    megapixels: 1.0
    notes: Fastest 768p path. More motion smear on large/fast action.

  - id: fl2va_turbo_8step
    name: FL2VA Turbo 8-step v1.0 (544p mixed AR)
    repo: lightx2v/Minimax-h3-Turbo
    filename: minimax_h3_fl2v_turbo_8step_v1.0_bf16.safetensors
    nfe: 8
    video_shift: 12.0
    audio_shift: 3.0
    lora_alpha: 8
    lora_scale: 1.0
    megapixels: 0.5
    notes: Mixed aspect-ratio 544p family. Lower VRAM than 768p.

  - id: fl2va_turbo_4step_v01
    name: FL2VA Turbo 4-step v0.1
    repo: lightx2v/Minimax-h3-Turbo
    filename: minimax_h3_fl2v_turbo_4step_v0.1.safetensors
    nfe: 4
    video_shift: 12.0
    audio_shift: 3.0
    lora_alpha: 8
    lora_scale: 1.0
    megapixels: 0.5
    notes: First public turbo LoRA. Prefer v1.0 files when available.

  - id: larryvrh_turbo_v4
    name: larryvrh Turbo v4 step600 EMA
    repo: larryvrh/MiniMax-H3-Turbo-Lora
    filename: minimax_h3_turbo_v4_step600_ema.safetensors
    nfe: 6
    video_shift: 12.0
    audio_shift: 3.0
    lora_alpha: 8
    lora_scale: 1.0
    megapixels: 1.0
    notes: Community few-step LoRA. Best at 6–8 steps, strength 1.0, simple scheduler.
